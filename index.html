<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Game deals</title><meta name="description" content="Daily game deals for PC, Xbox, PlayStation and Nintendo."/><link rel="icon" href="logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet"/>
<style>:root{--bg:#0D1020;--panel:#151A30;--p2:#1B2140;--line:#2A3258;--text:#E9ECFF;--mute:#8B93B8;--v:#7C5CFF;--a:#FFB547;--c:#FF5C7A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Figtree,system-ui,sans-serif}a{color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}h1,h2,h3{font-family:"Chakra Petch",sans-serif;margin:0}
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;font:700 19px "Chakra Petch",sans-serif;padding:4px 8px 18px}.brand img{width:34px}
nav button{display:flex;justify-content:space-between;width:100%;padding:9px 12px;margin-bottom:3px;border:0;border-radius:10px;background:none;color:var(--mute);font:inherit;font-weight:600;cursor:pointer}
nav button:hover{background:var(--p2);color:var(--text)}nav button.on{background:var(--v);color:#fff}nav small{opacity:.7}
nav h3{font-size:12px;color:var(--mute);padding:14px 12px 6px;font-weight:600}.follow{margin-top:auto;padding:14px 8px 0}.follow a{display:inline-block;margin:0 10px 6px 0;color:var(--mute);text-decoration:none;font-size:13px}.follow a:hover{color:var(--a)}
main{padding:24px 28px;min-width:0}.top{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.top h1{font-size:24px;margin-right:auto}
input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;min-width:220px}
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:340px;background:var(--p2) center/cover;border:1px solid var(--line);margin-bottom:22px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,16,32,.96) 32%,rgba(13,16,32,.1))}
.hero .in{position:relative;padding:34px;max-width:560px;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}.hero h2{font-size:32px}
.cta{align-self:flex-start;background:var(--v);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 15px Figtree;text-decoration:none;cursor:pointer}
.dots{position:absolute;right:18px;bottom:16px;display:flex;gap:8px}.dots button{width:11px;height:11px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}.dots .on{background:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer}
.card:hover{border-color:var(--v)}.t{aspect-ratio:16/9;background:var(--p2) center/cover}.b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.b h2{font-size:15px;line-height:1.3}
.p{margin-top:auto;display:flex;gap:8px;align-items:baseline}.p b{color:var(--a);font-size:18px}.p s{color:var(--mute);font-size:13px}.d{background:var(--c);font-weight:700;font-size:12px;padding:2px 7px;border-radius:6px}
.bd{display:flex;gap:6px;flex-wrap:wrap}.bd span{background:var(--p2);border:1px solid var(--line);font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;font-size:13px;color:var(--mute)}.hero .clamp{-webkit-line-clamp:3;font-size:14px;color:var(--text)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:560px;width:92%;padding:0}dialog::backdrop{background:rgba(5,7,16,.7)}
dialog .t{aspect-ratio:16/9}dialog .b{padding:20px;gap:10px}dialog .x{position:absolute;right:10px;top:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}footer a{color:var(--mute);margin-right:14px;text-decoration:none}footer a:hover{color:var(--a)}footer p{margin:10px 0 0}
@media(max-width:820px){.wrap{display:block}aside{position:static;height:auto}nav{display:flex;gap:6px;overflow:auto}nav button{white-space:nowrap;width:auto}nav h3,.follow{display:none}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body>
<div class="wrap"><aside><div class="brand"><img src="logo.svg" alt=""/><span id="name">Game deals</span></div><nav id="nav" aria-label="Categories"></nav><div class="follow" id="follow"></div></aside>
<main><div class="top"><h1 id="title">All games</h1><input id="q" type="search" placeholder="Search games" aria-label="Search games"/></div>
<div id="hero"></div><div class="grid" id="g"></div>
<footer><div id="legal"></div><p id="disc"></p><p>Trademarks belong to their owners. Prices can change, check the store before buying.</p></footer></main></div>
<dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PL=["PC","Xbox","PlayStation","Nintendo","Gift Cards"],LEGAL=[["privacy","Privacy"],["terms","Terms"],["affiliate-disclosure","Affiliate disclosure"],["cookies","Cookies"],["contact","Contact"]];
let D={games:[],trending:[],site:{},disclosure:""},cat="all",q="",slide=0,timer;
const has=(g,k)=>k==="all"||(k==="sale"&&g.discount)||(k==="wish"&&g.wishlist)||(g.platforms||[]).includes(k);
const price=g=>`<div class="p">${g.price!=null?`<b>${g.price.toFixed(2)}</b>`:""}${g.old_price?`<s>${g.old_price.toFixed(2)}</s>`:""}${g.discount?`<span class="d">-${g.discount}%</span>`:""}</div>`;
const bd=g=>`<div class="bd">${(g.platforms||[]).map(p=>`<span>${esc(p)}</span>`).join("")}</div>`;
function nav(){const it=[["all","All games"],["sale","On sale"],["wish","Wishlist"]];
 $("nav").innerHTML=it.map(b=>btn(b)).join("")+"<h3>Platforms</h3>"+PL.filter(p=>D.games.some(g=>has(g,p))).map(p=>btn([p,p])).join("");}
const btn=([k,l])=>`<button class="${k===cat?"on":""}" data-k="${k}">${l}<small>${D.games.filter(g=>has(g,k)).length}</small></button>`;
function hero(){clearInterval(timer);const t=D.trending.map(id=>D.games.find(g=>g.id===id)).filter(Boolean);
 if(!t.length||cat!=="all"||q){$("hero").innerHTML="";return}
 const s=t[slide%t.length];
 $("hero").innerHTML=`<section class="hero" aria-label="Trending games" style="${s.image?`background-image:url('${esc(s.image)}')`:""}"><div class="in">${bd(s)}<h2>${esc(s.title)}</h2>${price(s)}${s.description?`<p class="clamp">${esc(s.description)}</p>`:""}<a class="cta" href="${esc(s.link)}" target="_blank" rel="sponsored noopener">Get this deal</a></div><div class="dots">${t.map((_,i)=>`<button aria-label="Show game ${i+1}" data-s="${i}" class="${i===slide%t.length?"on":""}"></button>`).join("")}</div></section>`;
 if(t.length>1&&!matchMedia("(prefers-reduced-motion: reduce)").matches)timer=setInterval(()=>{slide++;hero()},6000);}
function list(){const L=D.games.filter(g=>has(g,cat)&&g.title.toLowerCase().includes(q));
 $("title").textContent=({all:"All games",sale:"On sale",wish:"Wishlist"})[cat]||cat;
 $("g").innerHTML=L.length?L.map(g=>`<button class="card" data-id="${esc(g.id)}"><div class="t" style="${g.image?`background-image:url('${esc(g.image)}')`:""}"></div><div class="b">${bd(g)}<h2>${esc(g.title)}</h2>${g.description?`<p class="clamp">${esc(g.description)}</p>`:""}${price(g)}</div></button>`).join(""):"<p style='color:var(--mute)'>No games here yet.</p>";}
const draw=()=>{nav();hero();list()};
$("nav").onclick=e=>{const k=e.target.closest("button")?.dataset.k;if(k){cat=k;slide=0;draw()}};
$("hero").onclick=e=>{const s=e.target.dataset.s;if(s!=null){slide=+s;hero()}};
$("q").oninput=e=>{q=e.target.value.toLowerCase();hero();list()};
$("g").onclick=e=>{const id=e.target.closest(".card")?.dataset.id,g=D.games.find(x=>x.id===id);if(!g)return;
 $("dlg").innerHTML=`<div class="t" style="${g.image?`background-image:url('${esc(g.image)}')`:""}"></div><button class="x" onclick="dlg.close()">Close</button><div class="b">${bd(g)}<h2>${esc(g.title)}</h2>${price(g)}<p style="margin:0;color:var(--mute)">${esc(g.description||"")}</p><a class="cta" href="${esc(g.link)}" target="_blank" rel="sponsored noopener">Get this deal</a><small style="color:var(--mute)">${esc(D.disclosure)}</small></div>`;$("dlg").showModal()};
fetch("games.json").then(r=>r.json()).then(d=>{D=d;const n=d.site?.name||"Game deals";document.title=n+" - game deals";$("name").textContent=n;
 $("follow").innerHTML=Object.entries(d.site?.socials||{}).map(([k,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${k[0].toUpperCase()+k.slice(1)}</a>`).join("");
 $("legal").innerHTML=LEGAL.map(([s,l])=>`<a href="${s}.html">${l}</a>`).join("");$("disc").textContent=d.disclosure;draw()});
</script></body></html>
